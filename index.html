
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kebab Case Generator</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body
  x-data="kebabGenerator()"
  x-init="initTheme()"
  :class="darkMode ? 'dark bg-gray-950 text-gray-100' : 'bg-gray-100 text-gray-800'"
  class="min-h-screen transition-colors duration-200">
  <main class="mx-auto max-w-2xl px-4 py-12">
    <div class="overflow-hidden rounded-2xl bg-white shadow-xl dark:bg-gray-900">
      <header class="bg-indigo-600 px-6 py-8 text-white">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h1 class="text-3xl font-bold">Kebab Case Generator</h1>
            <p class="mt-2 text-indigo-100">
              Convert any string into kebab-case instantly.
            </p>
          </div>
          <button
            type="button"
            @click="toggleTheme()"
            class="shrink-0 rounded-lg border border-white/30 bg-white/10 px-3 py-2 text-sm font-medium text-white transition hover:bg-white/20"
            :aria-label="darkMode ? 'Switch to light theme' : 'Switch to dark theme'"
            :title="darkMode ? 'Switch to light theme' : 'Switch to dark theme'"
          >
            <span x-text="darkMode ? '☀️ Light' : '🌙 Dark'"></span>
          </button>
        </div>
      </header>

      <section class="space-y-6 p-6">
        <div>
          <label for="inputText" class="mb-2 block font-semibold">
            Input string
          </label>

          <textarea
            id="inputText"
            x-model="input"
            rows="4"
            placeholder="Enter your text here..."
            class="w-full rounded-lg border border-gray-300 bg-white p-3 text-gray-900
                   outline-none transition focus:border-indigo-500
                   focus:ring-2 focus:ring-indigo-200
                   dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100
                   dark:placeholder-gray-400 dark:focus:ring-indigo-900"
          ></textarea>

          <div class="mt-2 flex justify-between text-sm text-gray-500 dark:text-gray-400">
            <span x-text="`${input.length} characters`"></span>

            <button
              @click="input = ''; copied = false"
              class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300"
            >
              Clear
            </button>
          </div>
        </div>

        <div>
          <div class="mb-2 flex items-center justify-between">
            <label class="font-semibold">Kebab-case output</label>
            <span class="rounded-full bg-green-100 px-3 py-1
                         text-xs font-medium text-green-700
                         dark:bg-green-900/40 dark:text-green-300">
              Live preview
            </span>
          </div>

          <div class="rounded-lg border border-gray-200 bg-gray-50 p-4 dark:border-gray-700 dark:bg-gray-800">
            <code
              x-text="output || 'Your output will appear here...'"
              class="block break-all text-indigo-700 dark:text-indigo-300"
            ></code>

            <div class="mt-4 flex justify-end">
              <button
                @click="copyOutput()"
                :disabled="!output"
                class="rounded-lg bg-indigo-600 px-4 py-2
                       text-sm font-medium text-white
                       hover:bg-indigo-700 disabled:cursor-not-allowed
                       disabled:opacity-50"
                x-text="copied ? 'Copied!' : 'Copy output'"
              ></button>
            </div>
          </div>
        </div>

        <div>
          <h2 class="mb-3 font-semibold">Try an example</h2>

          <div class="flex flex-wrap gap-2">
            <template x-for="example in examples" :key="example">
              <button
                @click="input = example; copied = false"
                x-text="example"
                class="rounded-full border border-gray-300 px-3 py-2
                       text-sm hover:border-indigo-500 hover:bg-indigo-50
                       dark:border-gray-700 dark:hover:bg-gray-800"
              ></button>
            </template>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    function kebabGenerator() {
      return {
        input: "Hello World! This is Kebab Case",
        copied: false,
        darkMode: false,

        initTheme() {
          const savedTheme = localStorage.getItem("kebab-case-theme");
          this.darkMode = savedTheme
            ? savedTheme === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
        },

        toggleTheme() {
          this.darkMode = !this.darkMode;
          localStorage.setItem("kebab-case-theme", this.darkMode ? "dark" : "light");
        },

        examples: [
          "Hello World",
          "JavaScript String Utils",
          "MyReactComponent",
          "API Response Handler",
          "user_profile_name"
        ],

        get output() {
          return this.input
            .trim()
            .normalize("NFKD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/([a-z0-9])([A-Z])/g, "$1-$2")
            .replace(/([A-Z])([A-Z][a-z])/g, "$1-$2")
            .replace(/[^a-zA-Z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .toLowerCase();
        },

        async copyOutput() {
          if (!this.output) return;

          try {
            await navigator.clipboard.writeText(this.output);
            this.copied = true;
            setTimeout(() => this.copied = false, 1500);
          } catch (error) {
            // Clipboard access may require HTTPS or localhost.
            alert("Unable to copy. Please copy the output manually.");
          }
        }
      };
    }
  </script>
</body>
</html>
